<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6"><title>CloudCost Guard</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root{--bg:#f3f4f6;--panel:#fff;--border:#d7dbe0;--text:#17191d;--muted:#626873;--shadow:rgba(0,0,0,.06)}body.dark{--bg:#090d14;--panel:#141c29;--border:#344257;--text:#f7f9fc;--muted:#c1ccda;--shadow:rgba(0,0,0,.38)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}main{max-width:1000px;margin:auto;padding:26px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:700;text-decoration:none}.brand img{width:38px;height:38px;border-radius:50%}.top-actions{display:flex;align-items:center;gap:8px}.theme-switch{display:flex;gap:5px;padding:5px;border:1px solid var(--border);border-radius:999px;background:var(--panel)}.theme-btn{border:0;border-radius:999px;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}.theme-btn.active{background:var(--bg);color:var(--text)}.auth-link{padding:7px 12px;border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:13px;text-decoration:none;white-space:nowrap}.auth-link.primary{background:var(--text);color:var(--bg)}body.dark .auth-link[data-logout]{background:#2b3a50;border-color:#8194b0;color:#fff;font-weight:700}body:not(.dark) .auth-link[data-logout]{background:#eef1f4;border-color:#687386;color:#17191d;font-weight:700}.auth-link[data-logout]:hover{filter:brightness(1.12)}.auth-link[data-logout]:focus-visible{outline:3px solid #5eead4;outline-offset:2px}
    nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 34px;padding-bottom:16px;border-bottom:1px solid var(--border)}nav a{padding:7px 11px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:13px;text-decoration:none}nav a:hover,nav a[aria-current="page"]{color:var(--text);border-color:var(--text)}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0 0 8px}h1{font-size:clamp(36px,7vw,58px);letter-spacing:-.055em;line-height:1.08;margin:0 0 16px}.lead{font-size:18px;color:var(--muted);max-width:800px}.panel{margin-top:24px;padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:0 8px 24px var(--shadow)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}.card{padding:18px;border:1px solid var(--border);border-radius:13px;background:var(--panel)}.card h2,.card h3{margin:0 0 8px;font-size:17px}.card p{margin:0;color:var(--muted)}.step{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}.cta{display:inline-block;margin-top:22px;padding:11px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:650;text-decoration:none}.source-note{font-size:13px;color:var(--muted);margin-top:10px}.chart-wrap{height:380px;position:relative}.review-list{display:grid;gap:14px}.review-card{padding:18px;border:1px solid var(--border);border-radius:13px;background:var(--panel)}.review-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stars{color:#997100;letter-spacing:.1em}.review-text{margin:12px 0;color:var(--text);white-space:pre-wrap}.review-meta{color:var(--muted);font-size:13px}.review-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.review-actions button,.review-card button{font:inherit;padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--text);cursor:pointer}.review-actions button.selected{border-color:var(--text);font-weight:700}.review-edit{display:grid;gap:10px;margin-top:12px}.review-edit input,.review-edit textarea,.review-edit select,.review-form input,.review-form textarea,.review-form select{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}.review-form{display:grid;gap:12px}.review-form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}.review-form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.review-form button.primary{justify-self:start;padding:9px 15px;border:0;border-radius:999px;background:var(--text);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}.status{color:var(--muted);min-height:22px;font-size:13px}.error{color:#b42318}.hidden{display:none!important}
    @media(max-width:560px){main{padding:20px 16px 44px}.chart-wrap{height:290px}.panel{padding:16px}.review-title{display:block}}
  </style>
</head>
<body><main>
  <header class="top"><a class="brand" href="/"><img src="/logo.svg" alt=""><span>CloudCost Guard</span></a><div class="top-actions" data-auth-links><div class="theme-switch" aria-label="Theme switcher"><button class="theme-btn" data-theme="light" type="button" aria-label="Light theme">☀️</button><button class="theme-btn" data-theme="dark" type="button" aria-label="Dark theme">🌙</button></div><a class="auth-link" href="/login" data-login>Log in</a><a class="auth-link primary" href="/signup" data-signup>Sign up</a><span data-user-name hidden></span><button class="auth-link" type="button" data-logout hidden>Log out</button></div></header>
  <nav aria-label="Main pages"><a href="/overview" data-page="overview">Overview</a><a href="/how-it-works" data-page="how-it-works">How it works</a><a href="/reviews" data-page="reviews">Reviews</a><a href="/cost-data" data-page="cost-data">Cost data</a><a href="/company-playbooks" data-page="company-playbooks">Company playbooks</a><a href="/cost-optimization">Cost optimization workspace</a></nav>
  <p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p class="lead" id="lead"></p><section id="content"></section>
  <p id="page-status" class="status" aria-live="polite"></p>
</main>
<script>
const slug=location.pathname.slice(1),pageCopy={
 overview:{title:'Cloud cost visibility, made actionable',lead:'CloudCost Guard helps teams inspect daily cloud spend, detect unusual changes, and estimate near-term budget risk using the dataset they load.',html:`<div class="grid"><article class="card"><h2>See usage costs</h2><p>Inspect daily spend totals and service-level trends from your uploaded CSV or the app’s demo seed data.</p></article><article class="card"><h2>Find unusual changes</h2><p>Use a rolling z-score or Isolation Forest to highlight values that differ from recent usage history.</p></article><article class="card"><h2>Investigate what changed</h2><p>Review the anomaly date, expected amount, score, and service that appears to contribute most to the change.</p></article><article class="card"><h2>Plan with context</h2><p>Compare a simple recent-trend projection with a budget you provide. This projection is not a financial guarantee.</p></article></div><a class="cta" href="/cost-optimization">Open cost optimization workspace →</a>`},
 'how-it-works':{title:'How it works',lead:'Upload service-level cost records, tune detection, review the chart, then validate possible improvements with workload owners.',html:`<div class="grid"><article class="card"><div class="step">01 · DATA</div><h2>Upload costs</h2><p>Use a CSV with date, service, and cost columns, including at least 20 distinct dates. The uploaded dataset replaces the current app cost data.</p></article><article class="card"><div class="step">02 · DETECTION</div><h2>Choose a method</h2><p>Rolling z-score compares a day with its recent window. Isolation Forest considers cost, day-over-day movement, and distance from a short rolling mean.</p></article><article class="card"><div class="step">03 · REVIEW</div><h2>Inspect findings</h2><p>Filter services, adjust the method parameters, compare anomalies, and inspect the forecast alongside your entered budget.</p></article><article class="card"><div class="step">04 · ACTION</div><h2>Validate optimization</h2><p>Check the cause with service owners before changing capacity. Consider rightsizing, schedules, storage lifecycle, and data-transfer behavior.</p></article></div><a class="cta" href="/cost-optimization">Go to CSV upload and live controls →</a>`},
 reviews:{title:'User reviews',lead:'Ratings and comments are submitted by users of this application. They are not pre-filled endorsements and are not independently verified.',html:`<section class="panel"><h2>Reviews</h2><div id="review-list" class="review-list" aria-live="polite"></div></section><section class="panel"><h2>Share your experience</h2><form id="review-form" class="review-form"><div class="review-form-row"><label>Name<input id="review-name" maxlength="80" required></label><label>Role or team<input id="review-role" maxlength="100" required></label><label>Rating<select id="review-rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label></div><label>Your review<textarea id="review-text" rows="4" maxlength="1000" required></textarea></label><button class="primary" type="submit">Submit review</button></form></section>`},
 'cost-data':{title:'Current cost data',lead:'The graph uses the latest 30 dates currently stored by this app. Upload a billing export in the workspace to analyze your own records; no cloud provider live billing API is connected.',html:`<section class="panel"><h2>Daily costs by service</h2><div class="chart-wrap"><canvas id="page-cost-chart" aria-label="Current loaded costs by service"></canvas></div><p class="source-note" id="source-note">Loading source information…</p></section><a class="cta" href="/cost-optimization">Upload CSV or start simulated feed →</a>`},
 'company-playbooks':{title:'Cloud optimization playbooks',lead:'Practical optimization checks for common cloud environments. These are general recommendations, not claims about private company bills or measured savings.',html:`<div class="grid"><article class="card"><h2>AWS</h2><p>Review compute rightsizing, idle resources, storage tiers and lifecycle, commitment coverage, and data transfer. See the <a href="/company/aws">AWS guide and current-data graph</a>.</p></article><article class="card"><h2>Azure</h2><p>Use budgets, ownership tags, cost analysis, rightsizing, commitment coverage, and idle-resource reviews across subscriptions. See the <a href="/company/azure">Azure guide and current-data graph</a>.</p></article><article class="card"><h2>Google Cloud</h2><p>Review utilization, committed-use coverage, storage lifecycle, idle capacity, and query or data-processing efficiency. See the <a href="/company/google-cloud">Google Cloud guide and current-data graph</a>.</p></article><article class="card"><h2>Streaming workloads</h2><p>For variable-demand services, review autoscaling boundaries, capacity planning, workload scheduling, and reliability requirements. This is general guidance, not a claim about any company's internal results. See the <a href="/company/netflix">streaming workload guide</a>.</p></article></div>`}
};
const page=pageCopy[slug];if(!page){location.replace('/');}else{document.title=`CloudCost Guard | ${page.title}`;document.getElementById('eyebrow').textContent='Cloud cost optimization';document.getElementById('title').textContent=page.title;document.getElementById('lead').textContent=page.lead;document.getElementById('content').innerHTML=page.html;document.querySelector(`[data-page="${slug}"]`)?.setAttribute('aria-current','page');}
const setTheme=theme=>{document.body.classList.toggle('dark',theme==='dark');document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme));document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#090d14':'#f3f4f6';localStorage.setItem('cloudcost-theme',theme);if(window.pageCostChart){const dark=theme==='dark';const palette=dark?['#5eead4','#60a5fa','#fbbf24','#c084fc','#fb7185','#a3e635']:['#334155','#0369a1','#b45309','#7e22ce','#be123c','#4d7c0f'];window.pageCostChart.data.datasets.forEach((dataset,index)=>{dataset.borderColor=palette[index%palette.length];dataset.backgroundColor=palette[index%palette.length]+'18';});window.pageCostChart.options.plugins.legend.labels.color=dark?'#f7f9fc':'#17191d';window.pageCostChart.options.plugins.tooltip.backgroundColor=dark?'#202c3d':'#17191d';window.pageCostChart.options.plugins.tooltip.borderColor=dark?'#5eead4':'#59636f';window.pageCostChart.options.scales.x.ticks.color=window.pageCostChart.options.scales.y.ticks.color=dark?'#c1ccda':'#626873';window.pageCostChart.options.scales.y.grid.color=dark?'#344257':'#d7dbe0';window.pageCostChart.update();}};setTheme(localStorage.getItem('cloudcost-theme')||'light');document.querySelectorAll('.theme-btn').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme)));
if(slug==='cost-data'){fetch('/api/cost-trend').then(r=>r.json()).then(data=>{document.getElementById('source-note').textContent=`Source: ${data.source}. ${data.note}`;const dark=document.body.classList.contains('dark'),palette=dark?['#5eead4','#60a5fa','#fbbf24','#c084fc','#fb7185','#a3e635']:['#334155','#0369a1','#b45309','#7e22ce','#be123c','#4d7c0f'];window.pageCostChart=new Chart(document.getElementById('page-cost-chart'),{type:'line',data:{labels:data.dates,datasets:Object.entries(data.services).map(([name,values],i)=>({label:name,data:values,borderColor:palette[i%palette.length],backgroundColor:palette[i%palette.length]+'18',borderWidth:2.5,pointRadius:0,tension:.25}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{color:dark?'#f7f9fc':'#17191d'}},tooltip:{backgroundColor:dark?'#202c3d':'#17191d',titleColor:'#fff',bodyColor:'#fff',borderColor:dark?'#5eead4':'#59636f',borderWidth:1}},scales:{y:{beginAtZero:true,ticks:{color:dark?'#c1ccda':'#626873',callback:v=>'$'+Number(v).toLocaleString()},grid:{color:dark?'#344257':'#d7dbe0'}},x:{ticks:{color:dark?'#c1ccda':'#626873',maxTicksLimit:10},grid:{display:false}}}}});}).catch(error=>{document.getElementById('source-note').textContent='Unable to load the current cost data: '+error.message;});}
</script>
<script src="/reviews-ui.js"></script><script src="/site-header.js"></script>
</body>
</html>
