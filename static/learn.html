<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f4"><title>CloudCost Guard | Learn</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{--bg:#f3f4f6;--panel:#fff;--border:#d7dbe0;--text:#17191d;--muted:#626873;--shadow:rgba(0,0,0,.06)}body.dark{--bg:#090d14;--panel:#141c29;--border:#344257;--text:#f7f9fc;--muted:#c1ccda;--shadow:rgba(0,0,0,.38)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}main{max-width:820px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:48px}.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:700;text-decoration:none}.brand img{width:38px;height:38px;border-radius:50%}.top-actions{display:flex;align-items:center;gap:8px}.theme-switch{display:flex;gap:5px;padding:5px;border:1px solid var(--border);border-radius:999px;background:var(--panel)}.theme-btn{border:0;border-radius:999px;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer}.theme-btn.active{background:var(--bg);color:var(--text)}.auth-link{padding:7px 12px;border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:13px;text-decoration:none;white-space:nowrap}.auth-link.primary{background:var(--text);color:var(--bg)}body.dark .auth-link[data-logout]{background:#2b3a50;border-color:#8194b0;color:#fff;font-weight:700}body:not(.dark) .auth-link[data-logout]{background:#eef1f4;border-color:#687386;color:#17191d;font-weight:700}.auth-link[data-logout]:hover{filter:brightness(1.12)}.auth-link[data-logout]:focus-visible{outline:3px solid #5eead4;outline-offset:2px}
    .back{color:var(--muted);text-decoration:none;font-size:14px}.back:hover{color:var(--text)}.eyebrow{margin:24px 0 10px;color:var(--muted);font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}h1{font-size:clamp(34px,7vw,56px);letter-spacing:-.05em;line-height:1.08;margin:0 0 22px}.lead{font-size:19px;color:var(--muted);max-width:700px}.content{margin-top:34px;padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:0 8px 28px var(--shadow)}.content h2{font-size:19px;margin:0 0 10px}.content p{color:var(--muted);margin:0 0 16px}.content p:last-child{margin-bottom:0}.steps{display:grid;gap:12px;margin-top:22px}.step{padding:16px;border:1px solid var(--border);border-radius:12px}.step b{display:block;margin-bottom:4px}.cta{display:inline-block;margin-top:26px;padding:11px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:650;text-decoration:none}
  </style>
</head>
<body><main>
  <header class="top"><a class="brand" href="/"><img src="/logo.svg" alt=""><span>CloudCost Guard</span></a><div class="top-actions" data-auth-links><div class="theme-switch" aria-label="Theme switcher"><button class="theme-btn" data-theme="light" type="button" aria-label="Light theme">☀️</button><button class="theme-btn" data-theme="dark" type="button" aria-label="Dark theme">🌙</button></div><a class="auth-link" href="/login" data-login>Log in</a><a class="auth-link primary" href="/signup" data-signup>Sign up</a><span data-user-name hidden></span><button class="auth-link" type="button" data-logout hidden>Log out</button></div></header>
  <a class="back" href="/">← Back to home</a>
  <p class="eyebrow">Cloud cost optimization</p><h1 id="title"></h1><p class="lead" id="lead"></p>
  <section class="content" id="content"></section>
  <a class="cta" href="/cost-optimization">Open cost optimization workspace →</a>
</main>
<script>
const pages={
 'what-it-does':{title:'What it does',lead:'CloudCost Guard turns raw cloud usage into clear daily cost trends, early warnings, and practical next steps.',body:'It brings cloud spend into one view and helps teams understand what changed, when it changed, and which service may be driving it.',sections:[['Monitor spend','Review daily costs by service and compare them with recent patterns.'],['Detect unusual changes','Use rolling z-score or Isolation Forest anomaly detection to highlight spending that differs from normal usage.'],['Make it actionable','Inspect alerts, forecast budget risk, simulate cost events, or upload a CSV export to explore your own data.']]},
 'why-it-matters':{title:'Why it matters',lead:'Cloud bills can grow quietly as workloads scale, experiments linger, or usage patterns shift.',body:'A shared view of cost helps engineering and finance teams catch waste sooner, understand the impact of changes, and plan budgets with fewer surprises.',sections:[['Catch drift early','Anomaly alerts make sudden changes easier to investigate before they persist.'],['Build shared visibility','Service-level trends give teams a common starting point for cost conversations.'],['Protect flexibility','Optimization focuses on removing waste while preserving the capacity teams need.']]},
 'how-it-works':{title:'How it works',lead:'Start with daily service-level costs, then use the dashboard to explore trends and possible anomalies.',body:'The demo accepts CSV files with date, service, and cost columns. Its API stores the imported records and calculates anomaly indicators and a simple 30-day projection.',sections:[['1. Load cost data','Upload a CSV containing at least 20 distinct dates, or use the included demo dataset.'],['2. Explore trends','Filter by service and inspect the daily cost graph, budget estimate, and alert table.'],['3. Investigate and act','Adjust detection settings, simulate a spike, add a live-feed day, or reset the demo data.']]},
 'customer-stories':{title:'Customer stories',lead:'Illustrative examples of how teams can use cost visibility to improve day-to-day cloud operations.',body:'These are sample scenarios for this demo, not verified customer endorsements or measured results.',sections:[['Platform engineering','A platform team reviews a compute spike, identifies the affected service, and routes an investigation to its owner.'],['FinOps','A FinOps analyst uses spend trends and the forecast to explain a budget variance to engineering and finance.'],['Technical leadership','A technology lead uses recurring patterns to prioritize rightsizing, storage lifecycle rules, and workload scheduling.']]}
};
const page=pages[location.pathname.split('/').pop()]||pages['what-it-does'];document.title=`CloudCost Guard | ${page.title}`;document.getElementById('title').textContent=page.title;document.getElementById('lead').textContent=page.lead;document.getElementById('content').innerHTML=`<h2>Overview</h2><p>${page.body}</p><div class="steps">${page.sections.map(([title,text])=>`<div class="step"><b>${title}</b><span>${text}</span></div>`).join('')}</div>`;
const setTheme=theme=>{document.body.classList.toggle('dark',theme==='dark');document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme));document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#0d0f12':'#eef1f4';localStorage.setItem('cloudcost-theme',theme)};setTheme(localStorage.getItem('cloudcost-theme')||'light');document.querySelectorAll('.theme-btn').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme)));
</script><script src="/site-header.js"></script></body></html>
